name: Testing config variables

on:
    workflow_dispatch: 

env: 
    cloud: google-cloud

jobs:
    greeting_job:
        runs-on: ubuntu-latest
        env: 
            Greeting: Hello
        steps:
            - name: "Say hello to aayushman"
              run: echo "$Greeting $name is using $cloud with project ${{ vars.PROJECT_ID }}"
              env:
                name: aayushmaan